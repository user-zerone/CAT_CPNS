<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulasi CAT CPNS</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <button id="theme-toggle-btn" class="theme-toggle-fixed" onclick="toggleDarkMode()">🌙 Dark</button>

    <!-- LOCK SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Simulasi CAT</h2>
            <p>Masukkan kredensial untuk memulai ujian</p>

            <input type="text" id="input-username" placeholder="Username..." autocomplete="off">
            <input type="password" id="input-pin" placeholder="PIN..." autocomplete="off">

            <select id="package-selection">
                <option value="" disabled selected>-- Pilih Paket Soal --</option>
                <option value="1">Paket 1</option>
                <option value="2">Paket 2</option>
                <option value="3">Paket 3</option>
                <option value="4">Paket 4</option>
                <option value="5">Paket 5</option>
                <option value="6">Paket 6</option>
                <option value="7">Paket 7</option>
                <option value="8">Paket 8</option>
                <option value="9">Paket 9</option>
                <option value="10">Paket 10</option>
            </select>

            <button id="btn-mulai" onclick="startSimulation()">Mulai Ujian</button>
            <p id="login-error" style="color:red; display:none; margin-top:8px;"></p>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        
        <div class="header-name">
            👤 <span id="display-name"></span>
        </div>

        <div class="top-nav-panel">
            <div class="legend">
                <div><span class="box-legend answered"></span> Dijawab</div>
                <div><span class="box-legend marked"></span> Ragu</div>
                <div><span class="box-legend unanswered"></span> Belum</div>
            </div>
            <div class="grid-container" id="number-grid"></div>
        </div>

        <div class="status-bar">
            <div class="status-item no-item">
                No. <span id="current-question-num">1</span>
            </div>
            <div class="status-item timer-item">
                ⏳ <span id="timer">01:40:00</span>
            </div>
            <button class="status-item btn-akhiri-top" onclick="endTest()">
                Akhiri Ujian
            </button>
        </div>

        <div class="main-content">
            <div class="question-panel">
                
                <div class="question-meta" id="question-meta" style="display: none;"></div>

                <img id="question-image" class="question-img" src="" alt="Gambar Soal">

                <div class="question-body" id="question-text"></div>
                
                <div class="options-container" id="options-container"></div>

                <div class="controls">
                    <button id="btn-prev" class="btn-nav">&laquo; Sebelumnya</button>
                    <button id="btn-mark" class="btn-warning">
                        <input type="checkbox" id="mark-checkbox" style="pointer-events: none; margin-right: 5px;"> Ragu
                    </button>
                    <button id="btn-next" class="btn-nav">Selanjutnya &raquo;</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/js/main2.js"></script>
</body>
</html>
